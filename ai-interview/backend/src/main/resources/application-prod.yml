# 生产环境：容器内走服务名（计划 §10.3）。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/ai_interview?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

app:
  upload-dir: /app/uploads
  websocket:                           # WS 握手 Origin（FIX-04）：默认含 Nginx 80 入口两源 + 开发 5173
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:http://127.0.0.1,http://localhost,http://127.0.0.1:5173,http://localhost:5173}
  security:
    trust-proxy: ${APP_SECURITY_TRUST_PROXY:true}   # FIX-09：Nginx 前置，信 X-Real-IP 做登录限流分桶
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1,http://localhost,http://127.0.0.1:5173,http://localhost:5173}
