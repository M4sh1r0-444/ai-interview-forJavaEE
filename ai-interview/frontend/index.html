      html,

      #app:empty::after {
        content: 'AI 模拟面试与能力提升平台 · 正在加载…';
        padding: 12px 20px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        box-shadow: 0 12px 30px rgba(30, 64, 175, 0.1);
        backdrop-filter: blur(16px);
        font-size: 14px;
        letter-spacing: 0.02em;
      }
