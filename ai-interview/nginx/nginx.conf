# 正式部署 Nginx 路由（计划 §10.2）：静态前端 + /api 反代 + /ws WebSocket 升级
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # FIX-09：显式覆写两个转发头——X-Real-IP 恒为真实连接地址，XFF 由 Nginx 追加而非透传客户端自带值，
        # 后端（app.security.trust-proxy=true）只信 X-Real-IP 做登录限流分桶，伪造 XFF 无法绕过
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;          # 面试会话长连接
    }

    client_max_body_size 12m;              # 音频上传（multipart 上限 12MB）
}
