# 正式部署 Nginx 路由（计划 §10.2）：静态前端 + /api 反代 + /ws WebSocket 升级
# FIX-10：安全日志格式——只记方法与 URI（$uri 不含 query string），WS 的 ?token=<JWT> 不落 access log
log_format safe '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log safe;

    # F6-4：静态资源 gzip（首屏 JS/CSS/JSON/SVG）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立即拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的构建产物长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # FIX-09：显式覆写两个转发头——X-Real-IP 恒为真实连接地址，XFF 由 Nginx 追加而非透传客户端自带值，
        # 后端（app.security.trust-proxy=true）只信 X-Real-IP 做登录限流分桶，伪造 XFF 无法绕过
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;          # 面试会话长连接
        # FIX-10：error log 的 upstream 失败信息会内嵌完整 request（含 ?token=），ws 路由阈值提到 crit 抑制
        error_log /var/log/nginx/error.log crit;
    }

    client_max_body_size 12m;              # 音频上传（multipart 上限 12MB）
}
